[project]
name = "harmonia"
version = "0.1.0-beta.1"
description = "Cliente Linux nativo para o YouTube Music com frontends GTK e Qt/Kirigami"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C901", "E4", "E7", "E9", "F", "I", "PLR0915", "RUF", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-statements = 60

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]
"src/harmonia/{app,auth,mpris,player,recognition,ui}.py" = ["E402"]
"src/harmonia/window_*.py" = ["E402"]
# Size debt: these files hold functions over the limits above. Each step of
# the modularization plan that splits one removes it from this list; no new
# file may join it.
"src/harmonia/{downloads,qt_integrations,video}.py" = [
  "C901",
  "PLR0915",
]
"src/harmonia/{window_detail,window_library,window_optional}.py" = [
  "PLR0915",
]
"tools/gtk_smoke.py" = ["PLR0915"]
