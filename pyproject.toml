[project]
name = "harmonia"
version = "0.1.0-beta.1"
description = "Cliente Linux nativo para o YouTube Music com frontends GTK e Qt/Kirigami"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]
"src/harmonia/{app,auth,mpris,player,recognition,ui}.py" = ["E402"]
"src/harmonia/window_*.py" = ["E402"]
"src/harmonia/stream_extractor.py" = ["SIM108"]
