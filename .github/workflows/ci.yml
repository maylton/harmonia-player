name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream desktop-file-utils gettext gir1.2-adw-1 \
            gir1.2-gstreamer-1.0 gir1.2-gtk-4.0 gir1.2-secret-1 \
            gir1.2-webkit-6.0 gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            meson ninja-build python3-gi python3-venv \
            xauth xvfb

      - name: Preparar ferramentas Python
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install pytest ruff

      - name: Validar código e testes
        run: |
          .venv/bin/ruff check src tests tools
          .venv/bin/ruff format --check src tests tools
          xvfb-run -a dbus-run-session -- .venv/bin/python -m pytest -q

      - name: Smoke do frontend GTK
        env:
          GSETTINGS_BACKEND: memory
          GTK_A11Y: none
          PYTHONPATH: src
        run: |
          set +e
          output=$(xvfb-run -a dbus-run-session -- timeout 8 \
            .venv/bin/python -m harmonia --gtk 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          if printf '%s\n' "$output" | grep -E 'Traceback|ModuleNotFoundError|ImportError'; then
            exit 1
          fi

      - name: Validar metadados e traduções
        run: |
          desktop-file-validate data/io.github.harmonia.Harmonia.desktop
          appstreamcli validate --no-net --strict data/io.github.harmonia.Harmonia.metainfo.xml
          msgfmt --check --check-format -o /dev/null po/pt_BR.po
          msgfmt --check --check-format -o /dev/null po/en.po

      - name: Compilar pacote Meson
        run: |
          meson setup build --buildtype=release
          meson compile -C build
