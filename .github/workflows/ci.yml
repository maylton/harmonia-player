name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream dbus-x11 desktop-file-utils flatpak flatpak-builder gettext gir1.2-adw-1 \
            gir1.2-gstreamer-1.0 gir1.2-gtk-4.0 gir1.2-secret-1 \
            gir1.2-webkit-6.0 gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            meson ninja-build python3-gi python3-venv \
            xauth xvfb

      - name: Configurar Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Preparar ferramentas Python
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install pytest ruff

      - name: Ruff lint
        run: .venv/bin/ruff check src tests tools

      - name: Ruff format
        run: .venv/bin/ruff format --check src tests tools

      - name: Testes Python
        run: xvfb-run -a dbus-run-session -- .venv/bin/python -m pytest -q

      - name: Construir variante GTK no runtime oficial
        run: |
          flatpak-builder build-gtk \
            --user \
            --install-deps-from=flathub \
            --force-clean \
            --disable-rofiles-fuse \
            --install \
            io.github.harmonia.Harmonia.yml

      - name: Validar sink de vídeo GTK no Flatpak
        run: |
          flatpak run --command=sh io.github.harmonia.Harmonia -c \
            'gst-inspect-1.0 playbin >/dev/null && gst-inspect-1.0 gtk4paintablesink >/dev/null'

      - name: Smoke do frontend GTK no runtime oficial
        run: |
          set +e
          output=$(xvfb-run -a dbus-run-session -- timeout 8 \
            flatpak run \
              --env=GSETTINGS_BACKEND=memory \
              --env=GTK_A11Y=none \
              io.github.harmonia.Harmonia --gtk 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          if printf '%s\n' "$output" | grep -E 'Traceback|ModuleNotFoundError|ImportError'; then
            exit 1
          fi

      # The Ubuntu job has libadwaita 1.5 and the window needs 1.7, so the full
      # GTK smoke (every page, theme and icon style, failing on any GTK warning)
      # runs on the checked-out sources inside the GNOME runtime.
      - name: Smoke completo da janela GTK no runtime oficial
        run: |
          xvfb-run -a dbus-run-session -- \
            flatpak run \
              --command=python3 \
              --filesystem="$PWD" \
              --env=PYTHONPATH="$PWD/src" \
              io.github.harmonia.Harmonia "$PWD/tools/gtk_smoke.py"

      - name: Construir variante KDE no runtime oficial
        run: |
          flatpak-builder build-kde \
            --user \
            --install-deps-from=flathub \
            --force-clean \
            --disable-rofiles-fuse \
            --install \
            io.github.harmonia.Harmonia.KDE.yml

      - name: Validar playback e sink de vídeo Qt no Flatpak
        run: |
          flatpak run --command=sh io.github.harmonia.Harmonia -c \
            'gst-inspect-1.0 playbin >/dev/null && gst-inspect-1.0 qml6glsink >/dev/null'

      - name: Smoke do frontend Qt/Kirigami e WebEngine
        run: |
          set +e
          output=$(xvfb-run -a dbus-run-session -- timeout 12 \
            flatpak run \
              --env=QT_QPA_PLATFORM=xcb \
              io.github.harmonia.Harmonia --qt 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          if printf '%s\n' "$output" | grep -E \
            'Traceback|ModuleNotFoundError|ImportError|QQmlApplicationEngine failed|module "QtWebEngine" is not installed|QtWebEngineProcess.*(not found|failed)'; then
            exit 1
          fi

      - name: Validar metadados e traduções
        run: |
          desktop-file-validate data/io.github.harmonia.Harmonia.desktop
          appstreamcli validate --no-net --strict data/io.github.harmonia.Harmonia.metainfo.xml
          msgfmt --check --check-format -o /dev/null po/pt_BR.po
          msgfmt --check --check-format -o /dev/null po/en.po

      - name: Compilar pacote Meson
        run: |
          meson setup build --buildtype=release
          meson compile -C build

  # The .deb and .rpm, built from the Meson install and installed into the
  # current Ubuntu and Fedora, where libadwaita is new enough for them.
  linux-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Instalar ferramentas de empacotamento
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gettext python3 rpm

      - name: Gerar .deb e .rpm
        run: bash packaging/linux/build-packages.sh

      # Docker's official images through the AWS public mirror: Docker Hub
      # rate-limits the shared runners' anonymous pulls.
      - name: Instalar o .deb no Ubuntu atual
        run: |
          version=$(sed -n "s/^project('harmonia', version: '\([^']*\)'.*/\1/p" meson.build)
          docker run --rm -v "$PWD:/src:ro" public.ecr.aws/docker/library/ubuntu:latest \
            sh /src/packaging/linux/check-install.sh "/src/build/linux/Harmonia-$version-all.deb" "$version"

      - name: Instalar o .rpm no Fedora atual
        run: |
          version=$(sed -n "s/^project('harmonia', version: '\([^']*\)'.*/\1/p" meson.build)
          docker run --rm -v "$PWD:/src:ro" public.ecr.aws/docker/library/fedora:latest \
            sh /src/packaging/linux/check-install.sh "/src/build/linux/Harmonia-$version-noarch.rpm" "$version"

      - name: Publicar os pacotes como artefato
        uses: actions/upload-artifact@v4
        with:
          name: harmonia-linux-packages
          path: |
            build/linux/Harmonia-*.deb
            build/linux/Harmonia-*.rpm
            build/linux/*.sha256
          if-no-files-found: error

  # The Windows port runs from MSYS2 UCRT64, with the same packages a
  # developer installs (see packaging/windows/build.sh). There libadwaita is
  # recent enough for the full GTK smoke, which the pytest run includes.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - name: Instalar MSYS2 UCRT64 e dependências
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-gettext-runtime
            mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-glib-networking
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-rs
            mingw-w64-ucrt-x86_64-gst-python
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pytest
            mingw-w64-ucrt-x86_64-ruff
            mingw-w64-ucrt-x86_64-webview2-loader

      - name: Ruff lint
        run: ruff check src tests tools

      - name: Ruff format
        run: ruff format --check src tests tools

      - name: Testes Python e smoke da janela GTK
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Gerar o instalador
        run: bash packaging/windows/build.sh

      - name: Publicar o instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: harmonia-windows-setup
          path: build/windows/*-setup.exe
          if-no-files-found: error
