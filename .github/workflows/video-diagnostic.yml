name: Video diagnostic

on:
  push:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-x11 gettext gir1.2-adw-1 gir1.2-gstreamer-1.0 gir1.2-gtk-4.0 \
            gir1.2-secret-1 gir1.2-webkit-6.0 gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good python3-gi python3-venv \
            xauth xvfb
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install pytest ruff
      - name: Lint and format
        run: |
          .venv/bin/ruff check src tests tools
          .venv/bin/ruff format --check src tests tools
      - name: Verbose tests
        run: |
          PYTHONUNBUFFERED=1 timeout 120 \
            xvfb-run -a dbus-run-session -- .venv/bin/python -m pytest -vv --durations=20
