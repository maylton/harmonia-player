name: Patch stream duration fallback (temporary)

on:
  push:
    branches:
      - feature/qt-kirigami-frontend

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Temporarily patch stream duration fallback'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add videoDetails duration fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/harmonia/innertube.py')
          source = path.read_text(encoding='utf-8')
          old = '''                duration = selected.get("approxDurationMs")
                url = str(selected["url"])
'''
          new = '''                duration = selected.get("approxDurationMs")
                if not duration:
                    length_seconds = (payload.get("videoDetails") or {}).get("lengthSeconds")
                    try:
                        duration = str(int(float(length_seconds)) * 1000) if length_seconds else None
                    except (TypeError, ValueError):
                        duration = None
                url = str(selected["url"])
'''
          if old not in source:
              raise SystemExit('expected resolve_stream duration block not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/harmonia/innertube.py
          git commit -m "Fallback to player video duration"
          git push
