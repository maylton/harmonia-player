name: KDE playback seek smoke (temporary)

on:
  push:
    branches:
      - feature/qt-kirigami-frontend

permissions:
  contents: read

jobs:
  build-and-launch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder dbus-x11

      - name: Configure Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build and install KDE variant
        run: |
          flatpak-builder build-kde \
            --user \
            --install-deps-from=flathub \
            --force-clean \
            --disable-rofiles-fuse \
            --install \
            io.github.harmonia.Harmonia.KDE.yml

      - name: Launch Qt frontend offscreen and reject QML load errors
        run: |
          set +e
          output=$(dbus-run-session -- timeout 12 \
            flatpak run \
              --env=QT_QPA_PLATFORM=offscreen \
              io.github.harmonia.Harmonia --qt 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E \
            'QQmlApplicationEngine failed|Type .* unavailable|ReferenceError|Cannot assign|Invalid property|is not a type|SeekSlider.*error'; then
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
