name: Format Qt branding stage (temporary)

on:
  push:
    branches:
      - feature/qt-kirigami-frontend

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'Temporarily format Qt branding stage'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Format changed Python files
        run: |
          python3 -m pip install --user ruff==0.16.4
          ~/.local/bin/ruff format src/harmonia/qt_backend.py tests/test_qt_branding.py

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/harmonia/qt_backend.py tests/test_qt_branding.py
          git commit -m "Format Qt branding stage"
          git push
